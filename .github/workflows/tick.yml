# Calls the Gold Signal Lab alert job every 4 minutes, 24/7.
# GitHub starts scheduled jobs late (often hours), so each run loops for ~5h45m and then
# starts the next run itself. The schedule is only a backup that restarts the chain if it ever stops.
# Only one run at a time; extra starts wait in the queue.
name: tick
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: tick
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Call the alert job every 4 minutes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          end=$((SECONDS + 345*60))
          while [ $SECONDS -lt $end ]; do
            curl -sS -m 90 -H "Authorization: Bearer $CRON_SECRET" https://gold-signal-lab.vercel.app/api/tick | cut -c1-200 || echo "call failed"
            echo
            sleep 240
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml -R "$GITHUB_REPOSITORY"
      # GitHub pauses schedules in repos with no activity for 60 days; an empty commit every ~30 days prevents that.
      - uses: actions/checkout@v4
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((30*86400)) ]; then
            git config user.name heartbeat-bot; git config user.email heartbeat-bot@users.noreply.github.com
            git commit --allow-empty -m "keepalive" && git push
          fi
